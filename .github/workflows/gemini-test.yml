
name: Mind Forge Script Generator

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Generate script
        env:
          SKRIPTA_KEY: ${{ secrets.SKRIPTA_KEY }}
        run: python generate_script.py

      - name: Save script
        uses: actions/upload-artifact@v4
        with:
          name: mind-forge-script
          path: script.txt
          if-no-files-found: error
          retention-days: 7
