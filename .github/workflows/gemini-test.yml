
name: MIND FORGE - Script and Voice

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Piper
        run: |
          python -m pip install --upgrade pip
          python -m pip install piper-tts

      - name: Generate script and voice
        env:
          SKRIPTA_KEY: ${{ secrets.SKRIPTA_KEY }}
        run: python generate_script.py

      - name: Save script and audio
        uses: actions/upload-artifact@v4
        with:
          name: mind-forge-video-assets
          path: |
            script.txt
            voice.wav
          if-no-files-found: error
          retention-days: 7
