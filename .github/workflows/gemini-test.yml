
import os
import json
import urllib.request
import urllib.error

API_KEY = os.environ.get("GEMINI_API_KEY")

if not API_KEY:
    raise RuntimeError("GEMINI_API_KEY is missing from GitHub Secrets")

MODEL = "gemini-2.5-flash"

prompt = """
Write an original 45-60 second YouTube Shorts narration
for MIND FORGE about a surprising psychological fact.
Use a powerful hook, simple English and a memorable ending.
Return only the narration. Do not invent statistics.
"""

url = (
    f"https://generativelanguage.googleapis.com/v1beta/"
    f"models/{MODEL}:generateContent?key={API_KEY}"
)

data = {
    "contents": [{"parts": [{"text": prompt}]}],
    "generationConfig": {
        "temperature": 0.8,
        "maxOutputTokens": 700
    }
}

request = urllib.request.Request(
    url,
    data=json.dumps(data).encode("utf-8"),
    headers={"Content-Type": "application/json"},
    method="POST"
)

try:
    with urllib.request.urlopen(request, timeout=60) as response:
        result = json.loads(response.read().decode("utf-8"))

    if "error" in result:
        raise RuntimeError(json.dumps(result["error"], indent=2))

    candidates = result.get("candidates", [])
    if not candidates:
        raise RuntimeError("Gemini returned no candidates: " + json.dumps(result))

    script = candidates[0]["content"]["parts"][0]["text"]

    with open("script.txt", "w", encoding="utf-8") as file:
        file.write(script)

    print("MIND FORGE SCRIPT GENERATED!")
    print(script)

except urllib.error.HTTPError as error:
    print("GEMINI HTTP ERROR:", error.code)
    print(error.read().decode("utf-8", errors="replace"))
    raise

except Exception as error:
    print("GEMINI ERROR:", repr(error))
    raise
