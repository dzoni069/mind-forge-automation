
name: Piper Diagnostic

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check Python
        run: python --version

      - name: Install Piper
        run: |
          python -m pip install --upgrade pip
          python -m pip install piper-tts
          python -m pip show piper-tts

      - name: Download voice
        run: |
          python -m piper.download_voices en_US-lessac-medium
          ls -lh

      - name: Generate audio
        run: |
          python -m piper -m en_US-lessac-medium -f test.wav -- "Welcome to Mind Forge."
          ls -lh test.wav

